<!doctype html>
<html lang="en" data-theme="light" style="color-scheme:light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Who Stopped Coming? — Marketing FM</title>
<meta name="description" content="Four questions. Find out how many of your members have quietly stopped showing up — and whether you'd have noticed.">
<meta name="robots" content="index,follow">
<meta name="theme-color" content="#f6f6f4">
<style>
:root{
  --font-sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --radius-md:8px; --radius-lg:12px;
  --canvas:#f6f6f4; --bg:#ffffff; --bg-2:#f1f1ef;
  --text:#1a1a1a; --text-2:#565656; --text-3:#888a8d;
  --border:#e2e2df; --border-2:#ededea;
  --brand:#D85A30; --brand-soft:#F5C4B3; --brand-wash:#FAECE7; --brand-deep:#712B13;
  --ok-bg:#e6f4ed; --ok-text:#15875a;
  --warn-bg:#fbf1e0; --warn-text:#b45309;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --canvas:#161618; --bg:#1f1f22; --bg-2:#2a2a2e;
  --text:#f2f2f2; --text-2:#b9b9b9; --text-3:#8c8c8c;
  --border:#3a3a3f; --border-2:#2f2f33;
  --brand:#F0997B; --brand-soft:#712B13; --brand-wash:#2a1a14; --brand-deep:#FAECE7;
  --ok-bg:#15281f; --ok-text:#4ade80;
  --warn-bg:#2d2310; --warn-text:#fbbf24;
}}
:root[data-theme="dark"]{
  --canvas:#161618; --bg:#1f1f22; --bg-2:#2a2a2e;
  --text:#f2f2f2; --text-2:#b9b9b9; --text-3:#8c8c8c;
  --border:#3a3a3f; --border-2:#2f2f33;
  --brand:#F0997B; --brand-soft:#712B13; --brand-wash:#2a1a14; --brand-deep:#FAECE7;
  --ok-bg:#15281f; --ok-text:#4ade80;
  --warn-bg:#2d2310; --warn-text:#fbbf24;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font-sans);background:var(--canvas);color:var(--text);line-height:1.55;
  -webkit-font-smoothing:antialiased;padding:0 0 env(safe-area-inset-bottom)}
.wrap{max-width:640px;margin:0 auto;padding:20px 18px 40px}
.brandbar{display:flex;align-items:center;gap:8px;padding:14px 0 20px;font-size:13px;
  font-weight:600;letter-spacing:.02em;color:var(--text-2)}
.brandbar a{color:inherit;text-decoration:none}
.dot{width:9px;height:9px;border-radius:50%;background:var(--brand);flex:none}
.card{background:var(--bg);border:1px solid var(--border);border-radius:var(--radius-lg);padding:22px}
h1{font-size:clamp(26px,6.5vw,36px);line-height:1.15;letter-spacing:-.02em;margin-bottom:12px}
.lede{color:var(--text-2);font-size:16px;margin-bottom:18px}
.stat{background:var(--brand-wash);border:1px solid var(--brand-soft);border-radius:var(--radius-md);
  padding:14px 16px;margin:18px 0;font-size:15px;color:var(--text)}
.stat b{color:var(--brand-deep);font-weight:700}
.stat small{display:block;margin-top:6px;font-size:12px;color:var(--text-3);line-height:1.4}
button{font-family:inherit;font-size:16px;cursor:pointer;border:none;background:none;color:inherit}
.btn{display:block;width:100%;background:var(--brand);color:#fff;font-weight:600;padding:15px 20px;
  border-radius:var(--radius-md);text-align:center;transition:opacity .15s;text-decoration:none}
.btn:active{opacity:.82}
.btn[disabled]{opacity:.38;cursor:default}
.btn-ghost{display:block;width:100%;background:transparent;color:var(--text-2);font-weight:500;
  padding:12px;text-align:center;font-size:14px;text-decoration:none}
.meta{font-size:12.5px;color:var(--text-3);margin-top:14px;text-align:center}
.prog{display:flex;gap:4px;margin-bottom:22px}
.prog i{flex:1;height:4px;border-radius:2px;background:var(--border);transition:background .25s}
.prog i.on{background:var(--brand)}
.step{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;
  color:var(--text-3);margin-bottom:10px}
.qtext{font-size:20px;line-height:1.35;letter-spacing:-.01em;margin-bottom:8px}
.qhelp{font-size:14.5px;color:var(--text-2);margin-bottom:22px}
.answers{display:flex;flex-direction:column;gap:10px}
.ans{width:100%;text-align:left;padding:15px 18px;border:1.5px solid var(--border);
  background:var(--bg);border-radius:var(--radius-md);font-weight:600;font-size:16px;
  display:flex;align-items:center;gap:12px;transition:border-color .12s,background .12s}
.ans:active{background:var(--bg-2)}
.ans .k{width:26px;height:26px;border-radius:50%;border:1.5px solid var(--border);flex:none;
  display:grid;place-items:center;font-size:12px;font-weight:700;color:var(--text-3)}
.ans.yes:active{border-color:var(--ok-text)}
.ans.no:active{border-color:var(--brand)}
.back{margin-top:18px}

/* numeric input — calc mode */
.field{display:flex;align-items:center;gap:10px;border:1.5px solid var(--border);background:var(--bg);
  border-radius:var(--radius-md);padding:4px 16px;margin-bottom:16px}
.field:focus-within{border-color:var(--brand)}
.field .pre{font-size:16px;font-weight:600;color:var(--text-3);flex:none}
.field input{flex:1;min-width:0;border:none;outline:none;background:transparent;color:var(--text);
  font-family:inherit;font-size:24px;font-weight:700;padding:12px 0;letter-spacing:-.01em}
.field input::-webkit-outer-spin-button,.field input::-webkit-inner-spin-button{
  -webkit-appearance:none;margin:0}
.field input[type=number]{-moz-appearance:textfield}
.field .suf{font-size:14px;color:var(--text-3);flex:none}
.fieldnote{font-size:13px;color:var(--warn-text);background:var(--warn-bg);border-radius:var(--radius-md);
  padding:10px 12px;margin:-6px 0 16px;line-height:1.45}

/* levels mode — the ladder */
.levelbig{font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;
  color:var(--brand);margin-bottom:6px}
.ladder{margin:20px 0;border:1px solid var(--border);border-radius:var(--radius-md);overflow:hidden}
.rung{display:flex;align-items:flex-start;gap:12px;padding:12px 14px;border-bottom:1px solid var(--border-2);
  font-size:14.5px;background:var(--bg)}
.rung:last-child{border-bottom:none}
.rung .n{font-weight:700;font-size:12px;width:22px;flex:none;color:var(--text-3);padding-top:2px}
.rung .t{flex:1}
.rung .t b{display:block;font-weight:600}
.rung .t span{color:var(--text-3);font-size:13px}
.rung.done{background:var(--ok-bg)}
.rung.done .n,.rung.done .t b{color:var(--ok-text)}
.rung.here{background:var(--brand-wash);box-shadow:inset 3px 0 0 var(--brand)}
.rung.here .n,.rung.here .t b{color:var(--brand-deep)}
.rung .tag{font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;
  padding:3px 7px;border-radius:99px;background:var(--brand);color:#fff;flex:none;align-self:center}

/* score mode + calc mode — the headline figure */
.big{font-size:clamp(38px,12vw,60px);line-height:1;letter-spacing:-.035em;font-weight:800;
  color:var(--brand-deep);margin:2px 0 4px}
.bigsub{font-size:15.5px;color:var(--text-2);margin-bottom:18px}
.bandname{font-size:19px;font-weight:700;letter-spacing:-.01em;margin-bottom:8px}
.list{margin:20px 0;border:1px solid var(--border);border-radius:var(--radius-md);overflow:hidden}
.item{padding:12px 14px;border-bottom:1px solid var(--border-2);font-size:14.5px;background:var(--bg)}
.item:last-child{border-bottom:none}
.item b{display:block;font-weight:600;margin-bottom:2px}
.item span{color:var(--text-3);font-size:13px}
.grouphead{padding:9px 14px;background:var(--bg-2);font-size:11.5px;font-weight:700;
  letter-spacing:.06em;text-transform:uppercase;color:var(--text-3);border-bottom:1px solid var(--border-2)}

.blocker{background:var(--warn-bg);border-radius:var(--radius-md);padding:14px 16px;margin:18px 0;font-size:15px}
.blocker b{color:var(--warn-text);display:block;font-size:12px;letter-spacing:.05em;
  text-transform:uppercase;margin-bottom:5px}
.gap{margin:22px 0}
.gap h2{font-size:15px;margin-bottom:8px;font-weight:600}
.gap ul{list-style:none;display:flex;flex-direction:column;gap:7px}
.gap li{font-size:14.5px;color:var(--text-2);padding-left:20px;position:relative}
.gap li::before{content:"\2192";position:absolute;left:0;color:var(--brand);font-weight:700}
.honest{font-size:13px;color:var(--text-3);line-height:1.5;border-left:2px solid var(--border);
  padding-left:12px;margin:18px 0}
footer{text-align:center;font-size:12px;color:var(--text-3);padding:26px 0 8px;line-height:1.6}
footer a{color:var(--text-3)}
.src{font-size:11.5px;color:var(--text-3);margin-top:20px;line-height:1.5}
.src a{color:var(--text-3)}
@media(min-width:560px){.answers{flex-direction:row}.ans{flex:1}}

/* Toolbox index */
.tool{display:block;text-decoration:none;color:inherit;background:var(--bg);
  border:1px solid var(--border);border-radius:var(--radius-lg);padding:18px 20px;margin-bottom:12px;
  transition:border-color .12s,background .12s}
.tool:active{background:var(--bg-2);border-color:var(--brand)}
.tool .tn{font-size:18px;font-weight:700;letter-spacing:-.01em;margin-bottom:4px;
  display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 8px;text-wrap:balance}
.tool .tn em{font-style:normal;font-size:11.5px;font-weight:700;letter-spacing:.05em;
  text-transform:uppercase;color:var(--text-3);flex:none}
.tool .td{font-size:14.5px;color:var(--text-2);margin-bottom:8px}
.tool .tg{font-size:13.5px;color:var(--brand);font-weight:600}

/* ── Web Interface Guidelines pass ──────────────────────────────── */

/* Touch: kill the 300ms double-tap delay and the default blue tap flash.
   Both are very visible on budget Android. */
html{touch-action:manipulation;-webkit-tap-highlight-color:transparent}

/* Landscape notches — bottom inset is on body, sides belong on the container. */
.wrap{padding-left:max(18px,env(safe-area-inset-left));
      padding-right:max(18px,env(safe-area-inset-right))}

/* Hover — laptop users had no feedback at all; only :active existed. */
@media (hover:hover){
  .btn:hover{opacity:.9}
  .btn-ghost:hover{color:var(--text)}
  .ans:hover{background:var(--bg-2);border-color:var(--text-3)}
  .ans.yes:hover{border-color:var(--ok-text)}
  .ans.no:hover{border-color:var(--brand)}
  .tool:hover{border-color:var(--brand);background:var(--bg-2)}
  .tool:hover .tg{text-decoration:underline}
  footer a:hover,.src a:hover{color:var(--text-2)}
}

/* Focus — visible keyboard navigation. :focus-visible so it never shows on tap. */
:focus-visible{outline:2px solid var(--brand);outline-offset:2px;border-radius:var(--radius-md)}
.ans:focus-visible,.btn:focus-visible,.tool:focus-visible{outline-offset:3px}
.field:focus-within{border-color:var(--brand);outline:2px solid var(--brand);outline-offset:2px}

/* Typography */
h1,.bandname,.qtext{text-wrap:balance}
.lede,.qhelp,.td{text-wrap:pretty}
.big,.prog,.step{font-variant-numeric:tabular-nums}

/* Long words and pasted content must never widen the page. */
.item b,.item span,.blocker,.rung .t,.qtext{overflow-wrap:anywhere}

/* Validation message sits with the field, not hidden behind a dead button. */
.fielderr{font-size:13.5px;color:var(--brand-deep);margin:-6px 0 16px}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{transition-duration:.01ms !important;animation-duration:.01ms !important}
}

/* On a laptop a short question card stranded at the top of an 800px window reads
   like a rendering error. margin:auto on the flex child centres it when there is
   spare room and does nothing when the content is taller than the viewport, so
   long result pages never clip. */
@media (min-width:900px){
  .wrap{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column}
  .wrap #app{margin-block:auto;width:100%}
}
</style>
</head>
<body>
<div class="wrap">
  <div class="brandbar"><span class="dot" aria-hidden="true"></span>
    <a href="/" translate="no">MARKETING FM &middot; FREE TOOL</a></div>
  <main id="app" aria-live="polite"></main>
  <footer>
    Marketing FM &middot; free resource &mdash; share it freely<br>
    <a href="https://open.spotify.com/show/6OxIsPRTPPKkE11UBAo21D">themarketingfmpodcast</a>
  </footer>
</div>

<script>
window.CFG = {

  title: "Who Stopped Coming? — Marketing FM",
  desc: "Four questions. Find out how many of your members have quietly stopped showing up — and whether you'd have noticed.",

  mode: "calc",
  wa: "254704334027",

  calcCta: "Show me",

  intro: {
    h1: "Who stopped coming?",
    lede: "Four questions. Under two minutes. You find out how much of your gym has quietly walked out — and whether you'd have known.",
    stat: "&ldquo;How many of your members actually came in last month?&rdquo;" +
          "<small>Most owners know the number they'd like it to be. Very few know the number it is.</small>",
    note: "Nothing to look up and no records needed. If you have to guess, guess &mdash; " +
          "and notice that you had to.",
    cta: "Start",
    privacy: "Nothing is saved. Nothing is sent. Nobody sees this but you."
  },

  inputs: [
    { q:"How many members does your gym have on the books?",
      h:"Everyone you'd still call a member today. Round it — this only needs to be close.",
      suf:"members", min:1, max:5000, ph:"80",
      err:"Enter how many members you have to continue.",
      clampNote:"Capped at 5,000. Past that this isn't the right tool." },

    { q:"What does one member pay you in a normal month?",
      h:"If you sell several plans, use the one most people are on.",
      pre:"KSh", min:0, max:1000000, ph:"3000",
      clampNote:"Capped at KSh 1,000,000 a month per member." },

    { q:"Of those members, how many have not been in during the last 30 days?",
      h:"Not the ones who stopped paying. The ones who stopped showing up.",
      suf:"members", min:0, max:5000,
      dunno:"I don't know",
      clampNote:"Capped at 5,000." },

    /* Worded to stand on its own, because the question before it can be answered
       "I don't know" — after which "those people" would refer to nothing. */
    { q:"In the last three months, how many members who'd stopped coming did you get in touch with?",
      h:"A call or a message that went to them personally. Not a broadcast to the whole list.",
      suf:"people", min:0, max:5000, ph:"0",
      clampNote:"Capped at 5,000." }
  ],

  more: { href:"/", label:"See the other free tools" },
  waNote: "Goes straight to Karl on WhatsApp. A real person, not a bot.",
  alt: { href:"https://open.spotify.com/show/6OxIsPRTPPKkE11UBAo21D",
         label:"Listen to themarketingfmpodcast" },

  /* ---- the arithmetic ----
     Four numbers the owner gave us, multiplied out. No benchmark, no retention
     figure and no assumed churn rate is imported — there is no reliable published
     Kenyan gym data, and inventing a range is the habit the Sources tab exists to
     break. Every figure below is his own answer or a product of two of them. */
  result: function(v, u){

    var DUNNO = -1;                 /* set by the "I don't know" button in the engine */

    var members = v[0];
    var fee     = v[1];
    var gone    = v[2];
    var chased  = v[3];

    var knows = (gone !== DUNNO);
    if (knows && gone > members) gone = members;   /* typo guard, not a judgement */

    /* Two versions, because the arithmetic differs by path: where he knows the count,
       the money figure is the members who left; where he doesn't, it is the whole
       membership. A disclosure that describes the wrong sum is worse than none. */
    var honest =
      '<p class="honest">Every figure here is your own four answers, multiplied out. I add nothing ' +
      'to it and there are no industry averages on this page. It uses one month\'s fee, so it counts ' +
      'what those members were worth last month — not what they would have been worth if they stayed.</p>';

    var honestBase =
      '<p class="honest">Every figure here is your own four answers, multiplied out. I add nothing ' +
      'to it and there are no industry averages on this page. The shilling figure is your whole ' +
      'membership at one month\'s fee — it is what the book is worth, not what you have lost.</p>';

    /* ---------- He can't answer. This is the finding, not a failed form. ---------- */
    if (!knows){
      var baseMonth = members * fee;

      return {
        body:
          '<div class="levelbig">Your result</div>' +
          '<h1 style="margin-bottom:8px">You don\'t know</h1>' +
          '<p class="lede">' + u.esc(
            "That's not a criticism and it isn't unusual — it's the finding. You have " +
            u.fmt(members) + " members on the books" +
            (fee > 0 ? ", worth about KSh " + u.fmt(baseMonth) + " a month between them" : "") +
            ", and right now there's no way to tell how many of them are still walking in.") + '</p>' +
          '<p class="lede">' + u.esc(
            "People leaving isn't the problem. People leave every gym on this road. The problem is " +
            "that you'd find out from your bank balance at the end of the month instead of from your " +
            "book at the start of it.") + '</p>' +
          '<p class="lede">' + u.esc(
            "Whatever your members are written in — a book, your phone, an old spreadsheet — the " +
            "answer is already in there. It has just never been counted.") + '</p>' + honestBase,
        msg: "Hi Karl - I did the Who Stopped Coming tool. I have " + u.fmt(members) +
             " members and I couldn't tell you how many of them have stopped showing up. " +
             "[GONE-?] What would it take to find out?",
        cta: "Ask what it takes to find out",
        alt: this.alt
      };
    }

    /* ---------- Nobody has drifted. Either very new, or a guess. ---------- */
    if (gone === 0){
      return {
        body:
          '<div class="levelbig">Your result</div>' +
          '<h1 style="margin-bottom:8px">Everyone still turns up</h1>' +
          '<p class="lede">' + u.esc(
            "All " + u.fmt(members) + " of your members have been in within the last month. If that's " +
            "genuinely true, there's nothing here for you to recover and nothing for me to sell you.") + '</p>' +
          '<p class="lede">' + u.esc(
            "The question worth asking instead is what happens to all of this the week you're not " +
            "around. That's a different tool.") + '</p>',
        msg: null,
        alt: { href:"/dependency-audit", label:"Take the Owner Dependency Audit instead" }
      };
    }

    var share  = Math.round((gone / members) * 100);
    var perMth = gone * fee;
    var left   = Math.max(gone - chased, 0);

    /* ---------- He knows, and he has already chased all of them. ---------- */
    if (chased >= gone){
      return {
        body:
          '<div class="levelbig">Your result</div>' +
          '<h1 style="margin-bottom:8px">You\'re already on it</h1>' +
          '<p class="lede">' + u.esc(
            u.fmt(gone) + " of your " + u.fmt(members) + " members haven't been in for a month, and " +
            "you've contacted all of them. That puts you ahead of nearly every gym I walk into.") + '</p>' +
          '<p class="lede">' + u.esc(
            "You don't need a list built for you — you're keeping one. The thing worth asking is " +
            "whether it still happens in a week when you're not there to do it.") + '</p>' + honest,
        msg: null,
        alt: { href:"/dependency-audit", label:"Take the Owner Dependency Audit instead" }
      };
    }

    var chasedLine = chased === 0
      ? "Not one of them has been contacted."
      : "You've been in touch with " + u.fmt(chased) + " of them. That leaves " + u.fmt(left) +
        " nobody has spoken to.";

    var cause =
      "None of them announced it. Nobody does. They just stopped coming, and there was nothing set " +
      "up to notice — so the first sign is a quiet month.";

    /* Fee of zero is a real answer. Report the count and drop the money. */
    if (fee === 0 || !isFinite(perMth)){
      return {
        body:
          '<div class="levelbig">Your result</div>' +
          '<div class="big">' + u.fmt(gone) + '</div>' +
          '<p class="bigsub">members who haven\'t been in for a month</p>' +
          '<p class="lede">' + u.esc("That's " + share + "% of the gym.") + '</p>' +
          '<p class="lede">' + u.esc(chasedLine) + '</p>' +
          '<p class="lede">' + u.esc(cause) + '</p>' + honest,
        msg: "Hi Karl - I did the Who Stopped Coming tool. " + u.fmt(gone) + " of my " +
             u.fmt(members) + " members haven't been in for a month - " + share + "% of the gym. " +
             "[GONE-" + gone + "] What would it take to get them back?",
        cta: "Ask what it takes to get them back",
        alt: this.alt
      };
    }

    return {
      body:
        '<div class="levelbig">Your result</div>' +
        '<div class="big">KSh ' + u.fmt(perMth) + '</div>' +
        '<p class="bigsub">a month, in members who have stopped showing up</p>' +
        '<p class="lede">' + u.esc(
          "That's " + u.fmt(gone) + " of your " + u.fmt(members) + " members — " + share +
          "% of the gym — who haven't been through the door in thirty days.") + '</p>' +
        '<p class="lede">' + u.esc(chasedLine) + '</p>' +
        '<p class="lede">' + u.esc(cause) + '</p>' +
        '<p class="lede">' + u.esc(
          "You don't need new members to fix that number. Those people already chose you once, and " +
          "their names are already written down somewhere.") + '</p>' + honest,
      msg: "Hi Karl - I did the Who Stopped Coming tool. " + u.fmt(gone) + " of my " +
           u.fmt(members) + " members haven't been in for a month - about KSh " + u.fmt(perMth) +
           " a month. [GONE-" + gone + "] What would it take to get them back?",
      cta: "Ask what it takes to get them back",
      alt: this.alt
    };
  },

  src: "This page has no benchmarks and no statistics in it. There is no reliable published figure " +
       "for Kenyan gym retention, so none is used. Every number shown is the four numbers you " +
       "entered, multiplied out — the share is your own two counts, and any shilling figure is one " +
       "month's fee multiplied by a member count you gave us. Which count, the page says on the line."
};
</script>
<script>
/* Marketing FM — tool engine.
   Three modes: levels | score | calc.
   The engine owns mechanics. The config owns arithmetic and every word a user reads. */
(function(){
"use strict";

var C   = window.CFG;
var app = document.getElementById("app");
var i   = 0;
var ans = [];
var restoring = false;   /* true while replaying a browser Back/Forward */

/* Recorded when a calc input is answered "I don't know". Negative, so it can never
   collide with a typed value — every numeric field has min >= 0. A config that offers
   the option must handle this sentinel explicitly; arithmetic on it is a bug. */
var DUNNO = -1;

/* ---------- helpers ---------- */

function esc(s){
  return String(s).replace(/[&<>"]/g, function(c){
    return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];
  });
}

/* Hand-rolled thousands separator rather than Intl.NumberFormat: the figure on the
   screen and the figure in the WhatsApp message must match character for character
   on every device, including ICU-trimmed Android builds. */
function fmt(n){
  n = Math.round(n);
  var s = String(Math.abs(n)), out = "", c = 0, x;
  for (x = s.length - 1; x >= 0; x--){
    out = s.charAt(x) + out;
    if (++c % 3 === 0 && x > 0) out = "," + out;
  }
  return (n < 0 ? "-" : "") + out;
}

function el(html){ app.innerHTML = html; window.scrollTo(0, 0); }
function on(id, ev, fn){ var n = document.getElementById(id); if (n) n[ev] = fn; }

function items(){ return C.mode === "calc" ? C.inputs : C.questions; }

function prog(){
  return '<div class="prog">' + items().map(function(_, x){
    return '<i class="' + (x < i ? "on" : "") + '"></i>';
  }).join("") + '</div>';
}

function stepLabel(){
  return '<div class="step">Question ' + (i + 1) + ' of ' + items().length + '</div>';
}

function wa(msg){
  return "https://wa.me/" + C.wa + "?text=" + encodeURIComponent(msg);
}

/* ---------- ?ref= ----------
   Partner attribution. A trainer sends .../dependency-audit?ref=KEVIN and the
   WhatsApp message arrives tagged [DEP-GYM-6 via KEVIN], so who introduced whom
   is never a matter of memory. Paying a friend on a disputed introduction is how
   you lose the friend and the channel.

   The value is URL input, so it is whitelisted to letters, digits, space, hyphen
   and underscore and capped at 24 characters. It is never written into the page —
   only into the WhatsApp text, where it is encodeURIComponent'd. */
var REF = (function(){
  try {
    var m = /[?&]ref=([^&#]*)/.exec(window.location.search || "");
    if (!m) return "";
    return decodeURIComponent(m[1].replace(/\+/g, " "))
             .replace(/[^A-Za-z0-9 _-]/g, "").trim().slice(0, 24);
  } catch (e) { return ""; }
})();

/* Slot the ref inside the existing tool tag so Karl reads both in one glance. */
function withRef(msg){
  if (!REF || !msg) return msg;
  if (/\[[^\]]+\]/.test(msg)) return msg.replace(/\[([^\]]+)\]/, "[$1 via " + REF + "]");
  return msg + " [via " + REF + "]";
}

/* Carry the ref across internal links, so an owner who lands on the Toolbox and
   picks a different tool is still attributed to whoever sent them. */
function internal(href){
  if (!REF || !href || !/^\//.test(href)) return href;
  return href + (href.indexOf("?") === -1 ? "?" : "&") + "ref=" + encodeURIComponent(REF);
}

/* ---------- history ----------
   Android's Back gesture is the primary navigation control for this audience.
   Without a history entry per question it exits the tool and destroys every answer.
   Each screen pushes one entry, so Back means "previous question" everywhere — and
   the in-page Back button calls history.back() too, so the two can never disagree. */

function mark(state, replace){
  if (restoring) return;
  try { history[replace ? "replaceState" : "pushState"](state, ""); } catch (e) {}
}

window.addEventListener("popstate", function(e){
  var st = e.state;
  restoring = true;
  if (!st || st.s === "intro")  { i = 0; drawIntro(); }
  else if (st.s === "q")        { i = Math.min(st.i, items().length - 1); draw(); }
  else if (st.s === "result")   { i = items().length; drawResult(); }
  restoring = false;
});

/* ---------- screens ---------- */

function drawIntro(){
  el(
    '<div class="card">' +
      '<h1>' + C.intro.h1 + '</h1>' +
      '<p class="lede">' + C.intro.lede + '</p>' +
      (C.intro.stat ? '<div class="stat">' + C.intro.stat + '</div>' : '') +
      (C.intro.note ? '<p class="lede" style="font-size:15px">' + C.intro.note + '</p>' : '') +
      '<button class="btn" id="go">' + C.intro.cta + '</button>' +
      '<p class="meta">' + C.intro.privacy + '</p>' +
    '</div>'
  );
  on("go", "onclick", function(){ i = 0; mark({ s:"q", i:0 }); draw(); });
}

function start(){
  ans = [];
  i = 0;
  mark({ s:"intro" }, true);
  drawIntro();
}

function draw(){
  if (i >= items().length){ drawResult(); return; }
  if (C.mode === "calc") inputScreen(); else questionScreen();
}

/* One entry point for moving forward, so every screen change pushes exactly once. */
function advance(){
  i++;
  if (i >= items().length) mark({ s:"result" }); else mark({ s:"q", i:i });
  draw();
}

/* In-page Back defers to the browser so the two stay in step. */
function back(){ history.back(); }

function questionScreen(){
  var q = C.questions[i];
  el(
    '<div class="card">' + prog() + stepLabel() +
      '<p class="qtext">' + q.q + '</p>' +
      '<p class="qhelp">' + q.h + '</p>' +
      '<div class="answers">' +
        '<button class="ans yes" id="y"><span class="k" aria-hidden="true">Y</span> ' + C.yesLabel + '</button>' +
        '<button class="ans no"  id="n"><span class="k" aria-hidden="true">N</span> ' + C.noLabel  + '</button>' +
      '</div>' +
      (i > 0 ? '<button class="btn-ghost back" id="b">&larr; Previous question</button>' : '') +
    '</div>'
  );
  on("y", "onclick", function(){ ans[i] = true;  advance(); });
  on("n", "onclick", function(){ ans[i] = false; advance(); });
  on("b", "onclick", back);
}

function inputScreen(){
  var f = C.inputs[i];
  var v = ans[i];
  var last = (i === C.inputs.length - 1);
  var min = (f.min != null ? f.min : 0);

  el(
    '<div class="card">' + prog() + stepLabel() +
      '<label class="qtext" for="v">' + f.q + '</label>' +
      '<p class="qhelp" id="vh">' + f.h + '</p>' +
      '<div class="field">' +
        (f.pre ? '<span class="pre" aria-hidden="true">' + f.pre + '</span>' : '') +
        '<input id="v" name="' + (f.name || ("answer" + (i + 1))) + '"' +
          ' type="number" inputmode="numeric" autocomplete="off" spellcheck="false"' +
          ' enterkeyhint="' + (last ? "go" : "next") + '" aria-describedby="vh"' +
          ' min="' + min + '" step="any" placeholder="' + (f.ph != null ? f.ph : "0") + '"' +
          (v != null ? ' value="' + esc(v) + '"' : '') + '>' +
        (f.suf ? '<span class="suf">' + f.suf + '</span>' : '') +
      '</div>' +
      '<div id="note" aria-live="polite"></div>' +
      '<button class="btn" id="next">' + (last ? C.calcCta : "Next") + '</button>' +
      /* "I don't know" is a real answer to some questions and the most valuable one
         to others — an owner who cannot say how many members stopped coming has just
         found the thing the tool exists to show him. Only rendered where the config
         asks for it; recorded as DUNNO so the arithmetic can branch on it. */
      (f.dunno ? '<button class="btn-ghost" id="dk">' + f.dunno + '</button>' : '') +
      (i > 0 ? '<button class="btn-ghost back" id="b">&larr; Previous question</button>' : '') +
    '</div>'
  );

  var input = document.getElementById("v");
  var note  = document.getElementById("note");

  function read(){
    var raw = input.value.trim();
    if (raw === "") return null;
    var n = Number(raw);
    if (!isFinite(n) || n < min) return null;
    return n;
  }

  /* Clamp rather than print a nonsense figure, and say so out loud. */
  function hint(){
    var n = read();
    note.innerHTML = (n !== null && f.max != null && n > f.max)
      ? '<p class="fieldnote">' + f.clampNote + '</p>' : "";
  }

  /* The button stays enabled. A greyed-out button with no explanation tells a tired
     person nothing; an inline message tells them exactly what to type. */
  function submit(){
    var n = read();
    if (n === null){
      note.innerHTML = '<p class="fielderr">' +
        (f.err || (min > 0 ? "Enter a number above " + (min - 1) + " to continue."
                           : "Enter a number to continue.")) + '</p>';
      input.focus();
      return;
    }
    if (f.max != null && n > f.max) n = f.max;
    ans[i] = n;
    advance();
  }

  input.oninput = hint;
  input.onkeydown = function(e){ if (e.key === "Enter"){ e.preventDefault(); submit(); } };
  on("next", "onclick", submit);
  on("dk", "onclick", function(){ ans[i] = DUNNO; advance(); });
  on("b", "onclick", back);
  hint();

  /* Autofocus on desktop only. On a phone it throws up the keyboard and pushes the
     question off screen before it has been read. */
  if (window.matchMedia && matchMedia("(hover:hover) and (pointer:fine)").matches) input.focus();
}

/* ---------- results ---------- */

/* levels: your level is the highest one where every rung below it is fully cleared. */
function cleared(lv){
  return C.questions.every(function(q, x){ return q.lv !== lv || ans[x] === true; });
}

function resLevels(){
  var lvl = 0, L;
  for (L = 1; L <= 5; L++){ if (cleared(L)) lvl = L; else break; }

  var blocker = null, skipped = 0, x;
  for (x = 0; x < C.questions.length; x++){
    if (C.questions[x].lv === lvl + 1 && ans[x] === false && !blocker) blocker = C.questions[x];
    if (C.questions[x].lv >  lvl + 1 && ans[x] === true) skipped++;
  }

  var rungs = C.levels.map(function(Lv){
    var cls = Lv.n < lvl ? "done" : (Lv.n === lvl ? "here" : "");
    return '<div class="rung ' + cls + '"><span class="n">' + Lv.n + '</span>' +
           '<span class="t"><b>' + esc(Lv.name) + '</b><span>' + esc(Lv.desc) + '</span></span>' +
           (Lv.n === lvl ? '<span class="tag">You</span>' : "") + '</div>';
  }).join("");

  var nextList = (C.next[lvl] || []).map(function(t){ return '<li>' + esc(t) + '</li>'; }).join("");
  var ctx = { lvl: lvl, blocker: blocker, next: Math.min(lvl + 1, 5) };

  return {
    body:
      '<div class="levelbig">Your result</div>' +
      '<h1 style="margin-bottom:6px">Level ' + lvl + ' &mdash; ' + esc(C.levels[lvl].name) + '</h1>' +
      '<p class="lede">' + esc(C.verdict[lvl]) + '</p>' +
      /* Blocker before the ladder: it is the one actionable line, and on a phone the
         six-rung ladder pushes it below the fold. */
      (blocker ? '<div class="blocker"><b>The first thing blocking you</b>' + esc(blocker.q) + '</div>' : "") +
      '<div class="ladder">' + rungs + '</div>' +
      (skipped ? '<p class="qhelp">' + C.skipNote(skipped) + '</p>' : "") +
      (nextList ? '<div class="gap"><h2>What Level ' + (lvl + 1) + ' would give you</h2><ul>' + nextList + '</ul></div>' : ""),
    msg: lvl < 5 ? C.message(ctx) : null,
    cta: lvl < 5 ? C.cta(ctx) : null,
    alt: C.alt
  };
}

function resScore(){
  var yes = 0, no = [], x;
  for (x = 0; x < C.questions.length; x++){
    if (ans[x] === true) yes++; else no.push(x);
  }

  var band = C.bands[C.bands.length - 1];
  for (x = 0; x < C.bands.length; x++){
    if (yes >= C.bands[x].min && yes <= C.bands[x].max){ band = C.bands[x]; break; }
  }

  /* Nobody fixes fifteen things. Return the NOs in the order they cost money. */
  var used = {}, groups = [];
  C.priority.forEach(function(g){
    var hits = g.q.filter(function(qi){ return no.indexOf(qi) >= 0; });
    hits.forEach(function(qi){ used[qi] = 1; });
    if (hits.length) groups.push({ name: g.name, q: hits });
  });
  var rest = no.filter(function(qi){ return !used[qi]; });
  if (rest.length) groups.push({ name: C.restLabel, q: rest });

  var listHtml = groups.map(function(g){
    return '<div class="grouphead">' + esc(g.name) + '</div>' +
      g.q.map(function(qi){
        return '<div class="item"><b>' + esc(C.questions[qi].q) + '</b>' +
               '<span>' + esc(C.questions[qi].no) + '</span></div>';
      }).join("");
  }).join("");

  var ctx = { yes: yes, total: C.questions.length, band: band,
              firstNo: no.length ? C.questions[no[0]].q : null };

  return {
    body:
      '<div class="levelbig">Your result</div>' +
      '<div class="big">' + yes + ' / ' + C.questions.length + '</div>' +
      '<p class="bigsub">' + C.scoreSub + '</p>' +
      '<div class="bandname">' + esc(band.name) + '</div>' +
      '<p class="lede">' + esc(band.verdict) + '</p>' +
      (listHtml ? '<div class="gap"><h2>' + C.listHead + '</h2></div><div class="list">' + listHtml + '</div>' : "") +
      '<p class="lede" style="margin-top:18px">' + esc(band.action) + '</p>',
    msg: band.sell ? C.message(ctx) : null,
    cta: band.sell ? C.cta(ctx) : null,
    alt: C.alt
  };
}

function compute(){
  return C.mode === "levels" ? resLevels()
       : C.mode === "score"  ? resScore()
       : C.result(ans.slice(), { fmt: fmt, esc: esc });
}

function drawResult(){
  var R = compute();
  el(
    '<div class="card">' + R.body +
      (R.msg
        ? '<a class="btn" href="' + wa(withRef(R.msg)) + '">' + R.cta + '</a>' +
          '<p class="meta">' + C.waNote + '</p>'
        : '<a class="btn" href="' + internal(R.alt.href) + '">' + R.alt.label + '</a>') +
      '<button class="btn-ghost" id="again">Take it again</button>' +
      (C.more ? '<a class="btn-ghost" href="' + internal(C.more.href) + '">' + C.more.label + '</a>' : "") +
      (C.src ? '<p class="src">' + C.src + '</p>' : "") +
    '</div>'
  );
  on("again", "onclick", function(){ ans = []; i = 0; mark({ s:"intro" }); drawIntro(); });
}

/* Exposed only so the boundary-case harness can drive scoring without clicking. */
window.__engine = {
  set: function(a){ ans = a.slice(); i = items().length; },
  result: compute,
  fmt: fmt,
  DUNNO: DUNNO,
  ref: function(){ return REF; },
  withRef: withRef,
  internal: internal
};

/* The brandbar and footer links live in the page chrome, not in #app, so they are
   never re-rendered. Carry the ref onto them once at load. */
(function(){
  if (!REF || !document.querySelectorAll) return;
  var links = document.querySelectorAll('a[href^="/"]'), x;
  for (x = 0; x < links.length; x++) links[x].setAttribute("href", internal(links[x].getAttribute("href")));
})();

start();
})();
</script>
</body>
</html>
